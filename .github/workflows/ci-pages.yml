name: Test, build and deploy Frontier
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and compile the Java Mars mission to JavaScript (TeaVM)
        run: |
          gradle -p java-mars --no-daemon coreTest generateJavaScript
          out=$(find java-mars/build -name mars.js | head -n 1)
          test -n "$out" || { echo "mars.js not produced"; find java-mars/build -maxdepth 4; exit 1; }
          mkdir -p client/public/java && cp "$out" client/public/java/mars.js
          ls -l client/public/java/mars.js
          if grep -qE '^export |^import ' client/public/java/mars.js; then echo "TeaVM produced an ES module; expected a classic script"; head -c 400 client/public/java/mars.js; exit 1; fi
      - name: Keep the compiled Java module for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mars-js
          path: client/public/java/mars.js
          retention-days: 7
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /GameTechMx-Frontier---NASA-Challenge-2026/
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Upload static client
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
