// Mars surface mission written in Java and compiled to JavaScript with TeaVM.
// Build:  gradle -p java-mars coreTest generateJavaScript
// Output: build/generated/teavm/js/mars.js  (copied to client/public/java/ by CI)
plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

dependencies {
    implementation teavm.libs.jso
}

teavm {
    js {
        mainClass = 'mx.gametech.frontier.mars.web.Main'
        targetFileName = 'mars.js'
        obfuscated = true
    }
}

// Dependency-free core tests (no JUnit): exit code 1 on any failure.
tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Mars mission core tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mx.gametech.frontier.mars.core.MarsCoreTest'
}
